name: ci

on:
  push:
    branches-ignore: []
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # The daemon embeds the dashboard, so the embed target has to exist before
      # anything will compile. CI does not need the real bundle to run go tests.
      - name: Stub the embedded dashboard
        run: mkdir -p internal/web/dist && touch internal/web/dist/index.html
      - run: go vet ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airtime-server/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: airtime-server/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # vite build transpiles with esbuild and never checks types, so without
      # this a type error reaches a release unnoticed.
      - run: npx tsc --noEmit
      - run: npm run build
