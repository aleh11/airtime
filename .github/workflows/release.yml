name: release

on:
  push:
    branches:
      - master
      - experimental
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=VERSION::'${version}' is not a semantic version" >&2
            exit 1
          fi
          tag="v${version}"

          # A plain version is a stable release and becomes releases/latest for
          # everyone, so only master cuts one. On any other branch VERSION just
          # names the release being worked towards, and the beta workflow builds
          # it. That is a normal state of affairs, not a failure.
          if [[ "${version}" != *-* && "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "::notice::${version} is the version ${GITHUB_REF_NAME} is working towards; betas cover it until master cuts it"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "${tag}" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::notice::${tag} is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.version.outputs.release == 'true'
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v7
        if: steps.version.outputs.release == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: airtime-server/frontend/package-lock.json

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: go test ./...

      - name: Build release binaries
        if: steps.version.outputs.release == 'true'
        run: scripts/build.sh "${{ steps.version.outputs.tag }}" linux/arm64 linux/arm

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            build/airtime-linux-arm64
            build/airtime-linux-arm64.sha256
            build/airtime-linux-arm
            build/airtime-linux-arm.sha256
            install.sh
            legacy-port.sh
          generate_release_notes: true
          # A hyphenated version (0.3.0-rc.1) publishes as a prerelease, so it is
          # not served by releases/latest/download and existing installs are left
          # alone. Plain versions (0.3.0) go out to everyone.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
