name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: airtime-server/frontend/package-lock.json

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: scripts/build.sh "${GITHUB_REF_NAME}" linux/arm64 linux/arm

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/airtime-linux-arm64
            build/airtime-linux-arm64.sha256
            build/airtime-linux-arm
            build/airtime-linux-arm.sha256
            install.sh
          generate_release_notes: true
